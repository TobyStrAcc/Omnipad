<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a4a"/>
      <stop offset="100%" stop-color="#f59342"/>
    </linearGradient>
    <linearGradient id="arrowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb24a"/>
      <stop offset="100%" stop-color="#ff6f3a"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- swoosh streak under clipboard -->
  <g opacity="0.55">
    <path d="M120 380 Q 260 320 460 360 L 460 392 Q 260 354 120 412 Z" fill="#ffd2a3"/>
    <path d="M140 408 Q 280 360 460 390 L 460 422 Q 280 392 140 440 Z" fill="#ffe1c1" opacity="0.85"/>
  </g>

  <!-- clipboard body -->
  <rect x="120" y="116" width="280" height="320" rx="22" fill="#fcefe1"/>

  <!-- clip top -->
  <rect x="200" y="80" width="120" height="64" rx="14" fill="#a02a23"/>
  <rect x="208" y="92" width="104" height="44" rx="10" fill="#7e1f19"/>
  <circle cx="260" cy="114" r="7" fill="#fcefe1"/>

  <!-- list item 1: ticked -->
  <circle cx="180" cy="206" r="22" fill="#ff6a3d"/>
  <polyline points="170,207 178,215 192,200" fill="none" stroke="#fcefe1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="222" y="200" width="148" height="14" rx="7" fill="#3b1f1c"/>

  <!-- list item 2: ticked -->
  <circle cx="180" cy="278" r="22" fill="#ff6a3d"/>
  <polyline points="170,279 178,287 192,272" fill="none" stroke="#fcefe1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="222" y="272" width="148" height="14" rx="7" fill="#3b1f1c"/>

  <!-- list item 3: empty -->
  <circle cx="180" cy="350" r="22" fill="none" stroke="#ff6a3d" stroke-width="5"/>
  <rect x="222" y="344" width="118" height="14" rx="7" fill="#3b1f1c"/>

  <!-- arrow circle, bottom right -->
  <circle cx="376" cy="392" r="64" fill="url(#arrowBg)"/>
  <g stroke="#fcefe1" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="350" y1="418" x2="402" y2="366"/>
    <polyline points="365,366 402,366 402,403"/>
  </g>
</svg>
